<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電子クーポン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --page-bg: #FBEFF3;
    --page-text: #3A2A2E;
    --page-text-dim: #8A6E76;
    --card-bg: #FFFFFF;
    --pink: #EA4C86;
    --pink-deep: #D81B60;
    --red: #E2231A;
    --yellow: #FFD966;
    --yellow-soft: #FFF2CC;
    --box-empty: #E9E9EA;
    --box-line: #BFBFC2;
    --cta: #EA4C86;
    --cta-text: #FFFFFF;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #1E1216;
      --page-text: #F3E7EA;
      --page-text-dim: #C4A3AC;
    }
  }
  :root[data-theme="dark"] {
    --page-bg: #1E1216;
    --page-text: #F3E7EA;
    --page-text-dim: #C4A3AC;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--page-bg);
    color: var(--page-text);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 26px 16px 44px;
  }

  .shop {
    text-align: center;
    margin-bottom: 16px;
  }
  .shop-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--pink-deep);
    letter-spacing: 0.02em;
  }

  .ticket-wrap {
    width: 100%;
    max-width: 400px;
    position: relative;
  }

  .mascot {
    width: 64px;
    height: auto;
    flex-shrink: 0;
    filter: drop-shadow(0 4px 6px rgba(58,42,46,0.25));
    pointer-events: none;
    align-self: flex-end;
    margin-bottom: 4px;
  }

  .ticket-outer {
    border: 3px dashed var(--pink);
    border-radius: 26px;
    padding: 8px;
    background: var(--card-bg);
    box-shadow: 0 16px 36px -18px rgba(216,27,96,0.35);
  }

  .ticket {
    position: relative;
    background: var(--card-bg);
    border-radius: 19px;
    padding: 30px 20px 22px;
    overflow: hidden;
  }

  .ribbon {
    position: absolute;
    top: 14px;
    left: -8px;
    right: -8px;
    background: linear-gradient(180deg, var(--pink) 0%, var(--pink-deep) 100%);
    color: #fff;
    font-weight: 900;
    font-size: 19px;
    text-align: center;
    padding: 11px 10px 13px;
    clip-path: polygon(0 0, 100% 0, 100% 78%, 96% 100%, 4% 100%, 0 78%);
  }

  .ticket-body { margin-top: 78px; text-align: center; }

  .amount-block {
    position: relative;
    padding: 14px 6px 10px;
    border-radius: 14px;
    background-image: repeating-linear-gradient(115deg, var(--yellow-soft) 0 14px, #ffffff 14px 28px);
  }
  .amount-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 2px;
    font-family: "Fredoka", "Zen Maru Gothic", sans-serif;
  }
  .amount-mark { font-size: 30px; font-weight: 900; font-family: "Zen Maru Gothic", sans-serif; color: var(--red); }
  .amount-value {
    font-size: 84px;
    font-weight: 900;
    font-family: "Zen Maru Gothic", sans-serif;
    line-height: 1;
    color: var(--red);
    -webkit-text-stroke: 2.5px #ffffff;
    paint-order: stroke fill;
    filter: drop-shadow(0 3px 0 rgba(216,27,96,0.25));
    letter-spacing: -0.02em;
  }
  .amount-unit { font-size: 30px; font-weight: 900; font-family: "Zen Maru Gothic", sans-serif; color: var(--red); margin-left: 2px; }
  .amount-caption { margin-top: 6px; font-size: 12.5px; color: var(--page-text-dim); font-weight: 500; }

  .divider-text {
    margin: 16px 0 4px;
    font-size: 13px;
    color: var(--pink-deep);
    font-weight: 700;
  }

  .check-panel {
    margin-top: 16px;
    border: 2px solid var(--pink);
    border-radius: 14px;
    overflow: hidden;
  }
  .check-head {
    background: var(--pink);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 6px;
  }
  .check-row {
    display: flex;
    justify-content: space-between;
    padding: 14px 10px 10px;
    background: #fff;
  }
  .check-item { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
  .check-box {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 2px solid var(--box-line);
    background: var(--box-empty);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease;
  }
  .check-box.done {
    background: var(--pink);
    border-color: var(--pink-deep);
  }
  .check-box svg { width: 16px; height: 16px; opacity: 0; transition: opacity 0.2s ease; }
  .check-box.done svg { opacity: 1; }
  .check-num { font-size: 10.5px; color: var(--page-text-dim); font-weight: 500; }

  .rules {
    margin-top: 18px;
    text-align: left;
    background: #FFF7F9;
    border: 1.5px solid #F6C9DA;
    border-radius: 14px;
    padding: 14px 16px 12px;
  }
  .rules-title {
    display: inline-block;
    background: var(--pink);
    color: #fff;
    font-weight: 700;
    font-size: 12.5px;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .rules ul { margin: 0; padding: 0; list-style: none; }
  .rules li {
    position: relative;
    padding-left: 1.3em;
    margin-bottom: 8px;
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.7;
    color: #241A1D;
  }
  .rules li:last-child { margin-bottom: 0; }
  .rules li::before {
    content: "●";
    position: absolute;
    left: 0;
    top: 0.2em;
    font-size: 8px;
    color: var(--pink-deep);
  }
  .rules li b { color: var(--red); }

  .done-badge {
    display: none;
    margin-top: 16px;
    font-size: 13px;
    font-weight: 700;
    background: var(--yellow-soft);
    border: 1px solid var(--yellow);
    color: var(--pink-deep);
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
  }
  .done-badge.show { display: block; }

  .tagline {
    margin-top: 18px;
    font-size: 13px;
    color: var(--pink);
    font-weight: 700;
    text-align: center;
  }

  .footer-line {
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--page-text-dim);
  }

  .use-btn {
    width: 100%;
    max-width: 400px;
    margin-top: 20px;
    padding: 16px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--cta) 0%, var(--pink-deep) 100%);
    color: var(--cta-text);
    font-size: 17px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 10px 22px -10px rgba(216,27,96,0.55);
    transition: transform 0.12s ease, opacity 0.2s ease;
  }
  .use-btn:active { transform: scale(0.97); }
  .use-btn:disabled { opacity: 0.4; cursor: default; box-shadow: none; }

  .staff-note {
    width: 100%;
    max-width: 400px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--page-text-dim);
    text-align: center;
    line-height: 1.6;
  }

  .history {
    width: 100%;
    max-width: 400px;
    margin-top: 26px;
  }
  .history-title {
    font-size: 13px;
    color: var(--page-text-dim);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .history-list {
    max-height: 160px;
    overflow-y: auto;
    border-top: 1px solid rgba(0,0,0,0.08);
  }
  .history-row {
    display: flex;
    justify-content: space-between;
    padding: 9px 2px;
    font-size: 13px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .history-empty { padding: 14px 2px; font-size: 12px; color: var(--page-text-dim); }

  .coupon-id {
    margin-top: 16px;
    font-size: 11px;
    color: var(--page-text-dim);
    text-align: center;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(58,42,46,0.5);
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding: 0 0 env(safe-area-inset-bottom, 0px);
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .sheet {
    width: 100%;
    max-width: 400px;
    background: var(--page-bg);
    color: var(--page-text);
    border-radius: 20px 20px 0 0;
    padding: 22px 22px calc(22px + env(safe-area-inset-bottom, 0px));
  }
  .sheet h2 { font-size: 17px; margin: 0 0 8px; }
  .sheet p { font-size: 13px; color: var(--page-text-dim); margin: 0 0 20px; line-height: 1.6; }
  .sheet-btns { display: flex; gap: 10px; }
  .sheet-btns button {
    flex: 1;
    padding: 13px;
    border-radius: 999px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .btn-cancel { background: rgba(0,0,0,0.06); color: var(--page-text); }
  .btn-confirm { background: var(--pink-deep); color: #fff; }
</style>
</head>
<body>

  <div class="shop">
    <div class="shop-name" id="shopName">🌿 SHOP NAME 🌿</div>
  </div>

  <div class="ticket-wrap">
    <div class="ticket-outer">
      <div class="ticket">
        <div class="ribbon" id="ribbonText">電子クーポン</div>
        <div class="ticket-body">

          <div class="amount-block">
            <div class="amount-row">
              <span class="amount-mark">¥</span>
              <span class="amount-value" id="balanceAmount">500</span>
              <img class="mascot" id="mascotImg" src="" alt="">
            </div>
            <div class="amount-caption" id="balanceCaption">ご利用可能な残高</div>
          </div>

          <div class="divider-text" id="taglineTop">大切なお客様に、もっとお得に</div>

          <div class="check-panel">
            <div class="check-head">100円ごとに1つチェック！</div>
            <div class="check-row" id="checkRow"></div>
          </div>

          <div class="done-badge" id="doneBadge">クーポンは全てご利用いただきました</div>

          <div class="rules">
            <span class="rules-title">ご利用条件</span>
            <ul id="rulesList"></ul>
          </div>

          <div class="tagline" id="taglineBottom">Good Days Start Here!</div>

          <div class="footer-line">
            <span id="issuedLabel">発行日 -</span>
            <span id="couponId">クーポンID -</span>
          </div>

        </div>
      </div>
    </div>
  </div>

  <button class="use-btn" id="useBtn">100円分を使う</button>
  <div class="staff-note">スタッフはお客様の画面には触れません。画面の表示のみご確認ください。</div>

  <div class="history">
    <div class="history-title">利用履歴</div>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="sheet">
      <h2>100円分を使用しますか？</h2>
      <p id="sheetDesc">確定すると残高が100円減ります。この操作は取り消せません。</p>
      <div class="sheet-btns">
        <button class="btn-cancel" id="cancelBtn">キャンセル</button>
        <button class="btn-confirm" id="confirmBtn">使用する</button>
      </div>
    </div>
  </div>

  document.getElementById("mascotImg").src = "data:image/png;base64," + MASCOT_B64;

  document.getElementById("shopName").textContent = CONFIG.storeName;
  document.getElementById("ribbonText").textContent = CONFIG.ribbonText;
  document.getElementById("taglineTop").textContent = CONFIG.taglineTop;
  document.getElementById("taglineBottom").textContent = CONFIG.taglineBottom;

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  var rulesListEl = document.getElementById("rulesList");
  CONFIG.rules.forEach(function (r) {
    var li = document.createElement("li");
    var safe = escapeHtml(r).replace(/([0-9,]+円)/g, "<b>$1</b>");
    li.innerHTML = safe;
    rulesListEl.appendChild(li);
  });

  var STORAGE_KEY = "coupon_state_v2";

  function makeId() {
    var chars = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
    var out = "";
    for (var i = 0; i < 8; i++) {
      out += chars[Math.floor(Math.random() * chars.length)];
      if (i === 3) out += "-";
    }
    return out;
  }

  function todayLabel() {
    var d = new Date();
    return d.getFullYear() + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0");
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (typeof parsed.balance === "number" && Array.isArray(parsed.history)) return parsed;
      }
    } catch (e) {
      console.error("coupon: read failed", e);
    }
    return {
      id: makeId(),
      issued: todayLabel(),
      balance: CONFIG.initialBalance,
      history: []
    };
  }

  function save(state) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error("coupon: save failed", e);
    }
  }

  var state = load();

  var balanceAmountEl = document.getElementById("balanceAmount");
  var balanceCaptionEl = document.getElementById("balanceCaption");
  var checkRowEl = document.getElementById("checkRow");
  var doneBadgeEl = document.getElementById("doneBadge");
  var useBtnEl = document.getElementById("useBtn");
  var historyListEl = document.getElementById("historyList");
  var couponIdEl = document.getElementById("couponId");
  var issuedLabelEl = document.getElementById("issuedLabel");
  var overlayEl = document.getElementById("overlay");
  var sheetDescEl = document.getElementById("sheetDesc");

  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12.5L9.5 18L20 6" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function totalUnits() {
    return Math.max(1, Math.round(CONFIG.initialBalance / CONFIG.unit));
  }

  function render() {
    balanceAmountEl.textContent = state.balance.toLocaleString("ja-JP");
    couponIdEl.textContent = "クーポンID " + state.id;
    issuedLabelEl.textContent = "発行日 " + state.issued;

    var usedCount = Math.round((CONFIG.initialBalance - state.balance) / CONFIG.unit);

    if (state.balance <= 0) {
      balanceCaptionEl.textContent = "ご利用ありがとうございました";
      doneBadgeEl.classList.add("show");
      useBtnEl.disabled = true;
      useBtnEl.textContent = "利用可能額がありません";
    } else {
      balanceCaptionEl.textContent = "ご利用可能な残高";
      doneBadgeEl.classList.remove("show");
      useBtnEl.disabled = false;
      useBtnEl.textContent = CONFIG.unit + "円分を使う";
    }

    checkRowEl.innerHTML = "";
    var n = totalUnits();
    for (var i = 0; i < n; i++) {
      var done = i < usedCount;
      var item = document.createElement("div");
      item.className = "check-item";
      var box = document.createElement("div");
      box.className = "check-box" + (done ? " done" : "");
      box.innerHTML = CHECK_SVG;
      var num = document.createElement("div");
      num.className = "check-num";
      num.textContent = (i + 1) + "回目";
      item.appendChild(box);
      item.appendChild(num);
      checkRowEl.appendChild(item);
    }

    if (state.history.length === 0) {
      historyListEl.innerHTML = '<div class="history-empty">まだ利用履歴はありません</div>';
    } else {
      historyListEl.innerHTML = "";
      var rows = state.history.slice().reverse();
      rows.forEach(function (h) {
        var row = document.createElement("div");
        row.className = "history-row";
        var left = document.createElement("span");
        left.textContent = h.label;
        var right = document.createElement("span");
        right.textContent = "-" + CONFIG.unit + "円";
        right.style.color = "#D81B60";
        right.style.fontWeight = "700";
        row.appendChild(left);
        row.appendChild(right);
        historyListEl.appendChild(row);
      });
    }
  }

  function openConfirm() {
    if (state.balance <= 0) return;
    sheetDescEl.textContent = "確定すると残高が" + CONFIG.unit + "円減り、残り" + (state.balance - CONFIG.unit).toLocaleString("ja-JP") + "円になります。";
    overlayEl.classList.add("show");
  }
  function closeConfirm() { overlayEl.classList.remove("show"); }

  function commitUse() {
    if (state.balance <= 0) { closeConfirm(); return; }
    state.balance = Math.max(0, state.balance - CONFIG.unit);
    var now = new Date();
    var label = now.getFullYear() + "/" + String(now.getMonth() + 1).padStart(2, "0") + "/" + String(now.getDate()).padStart(2, "0")
      + " " + String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    state.history.push({ label: label, amount: CONFIG.unit });
    save(state);
    render();
    closeConfirm();
  }

  useBtnEl.addEventListener("click", openConfirm);
  document.getElementById("cancelBtn").addEventListener("click", closeConfirm);
  document.getElementById("confirmBtn").addEventListener("click", commitUse);
  overlayEl.addEventListener("click", function (e) { if (e.target === overlayEl) closeConfirm(); });

  render();
})();
</script>
