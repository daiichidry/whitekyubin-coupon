<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アプリ新規登録クーポン</title><style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#fff5fa;font-family:"Noto Sans JP","Yu Gothic",sans-serif;color:#333}.coupon{max-width:430px;margin:auto;background:#fff;border:4px solid #d81b60;border-radius:16px;overflow:hidden;box-shadow:0 3px 14px #0002}.header{background:#d81b60;color:#fff;text-align:center;padding:16px 8px 12px;font-weight:900;font-size:25px}.header span{color:#fff200}.sub{text-align:center;padding:9px;background:#fff8fc;font-size:14px;font-weight:bold}.big{text-align:center;padding:14px 5px 8px}.num{color:#d81b60;font-size:72px;line-height:.95;font-weight:900}.yen{color:#d81b60;font-size:32px;font-weight:bold}.off{color:#d81b60;font-size:30px;font-weight:bold}.catch{display:inline-block;margin:10px auto 6px;padding:6px 20px;background:#fff0f6;border-radius:20px;font-weight:bold;font-size:14px}.title{margin:8px 12px 0;background:#d81b60;color:#fff;text-align:center;padding:8px;border-radius:8px 8px 0 0;font-weight:bold}.stamps{display:flex;justify-content:center;gap:7px;padding:13px 6px 18px;background:#fff8fc}.box{width:54px;height:54px;border:2px solid #777;border-radius:6px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;position:relative;font-size:25px;font-weight:bold}.used{background:#f8d5e3;color:#d81b60}.used:after{content:'✓';font-size:36px}.label{position:absolute;bottom:-22px;font-size:11px;color:#555;font-weight:normal}.remain{text-align:center;padding:11px;border-top:1px solid #eee}.remain b{color:#d81b60;font-size:32px}button{display:block;width:calc(100% - 30px);margin:10px 15px;padding:16px;border:0;border-radius:10px;background:#d81b60;color:#fff;font-size:20px;font-weight:bold}button:disabled{background:#999}.msg{text-align:center;color:#d81b60;font-weight:bold;min-height:22px}.cond{margin:12px;padding:12px;border-radius:8px;background:#fff5fa;font-size:11px;line-height:1.7}.cond strong{display:inline-block;background:#d81b60;color:#fff;padding:5px 15px;border-radius:5px}.exp{margin:8px 12px 15px;padding:10px;background:#f7f7f7;border-radius:8px;text-align:center}.loading{text-align:center;padding:35px;color:#d81b60;font-weight:bold}</style></head><body>
<div id="load" class="loading">クーポンを読み込んでいます…</div><div id="coupon" class="coupon" style="display:none"><div class="header">アプリ<span>新規登録</span>クーポン</div><div class="sub">大切なお洋服を、もっと気軽に。</div><div class="big"><span id="big" class="num">500</span><span class="yen">円</span><span class="off">引き</span><div class="catch">＼ 100円ごとに1つチェック！ ／</div></div><div class="title">ご利用状況</div><div id="stamps" class="stamps"></div><div class="remain">現在のクーポン残額<br><b><span id="amount">500</span>円</b></div><button id="btn" onclick="use()">100円分を使用する</button><div id="msg" class="msg"></div><div class="cond"><strong>ご利用条件</strong><ul><li>お会計値引後1,000円毎に100円お値引きします。</li><li>着物・革製品・補正にはご利用いただけません。</li><li>本券は現金への換金はできません。</li><li>有効期限内にご利用ください。</li><li>アプリに新規登録された方のみご利用いただけます。</li></ul></div><div class="exp">有効期限　発行日から1年間</div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbyZf3AB1IC4EO2D-0fQofo-quIcCxGrFDBojyREWM8xhxFLK0tiKEDcRUK9NP0pBBW5/exec
function api(p,ok,ng){const cb='cb'+Date.now()+'_'+(++seq),s=document.createElement('script');let t=setTimeout(()=>{delete window[cb];s.remove();ng()},15000);window[cb]=r=>{clearTimeout(t);delete window[cb];s.remove();ok(r)};p.callback=cb;s.src=API+'?'+new URLSearchParams(p);s.onerror=()=>{clearTimeout(t);delete window[cb];s.remove();ng()};document.body.appendChild(s)}
function show(a){a=Number(a);big.textContent=a;amount.textContent=a;let u=Math.floor((500-a)/100),h='';for(let i=0;i<5;i++)h+=i<u?'<div class="box used"><span class="label">'+(i+1)+'回目</span></div>':'<div class="box">□<span class="label">'+(i+1)+'回目</span></div>';stamps.innerHTML=h;btn.disabled=a<=0;btn.textContent=a<=0?'クーポン使用済み':'100円分を使用する'}
function loadCoupon(){api({action:'get',id:localStorage.getItem(KEY)||''},r=>{if(!r.ok)throw 0;if(r.newCustomer)localStorage.setItem(KEY,r.id);show(r.amount);load.style.display='none';coupon.style.display='block'},()=>load.textContent='読み込みに失敗しました。ページを再読み込みしてください。')}
function use(){const id=localStorage.getItem(KEY);if(!id||!confirm('100円分を使用しますか？'))return;btn.disabled=true;api({action:'use',id:id},r=>{if(!r.ok)throw 0;show(r.amount);msg.textContent='100円分を使用しました。'},()=>{btn.disabled=false;msg.textContent='処理に失敗しました。'})}load();
loadCoupon();/script></body></html>
