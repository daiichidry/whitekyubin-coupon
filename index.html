<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電子クーポン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>

:root{--pink:#f23b80;--navy:#173f78;--gold:#f1c52b;--text:#26344f;--muted:#8b91a0}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;color:var(--text)}
body{min-height:100vh}
.app-shell{width:100%;display:flex;flex-direction:column;align-items:center;background:#fff}
.visual{position:relative;width:min(100vw,680px);line-height:0;overflow:hidden}
.design{display:block;width:100%;height:auto}
.dynamic-balance{
 position:absolute;left:34.5%;top:43.7%;width:31%;height:8.8%;
 display:flex;align-items:center;justify-content:center;
 font-size:clamp(42px,10vw,88px);font-weight:900;line-height:1;
 color:#f32d72;letter-spacing:-.06em;
 background:rgba(255,255,255,.94);border-radius:18px;
 text-shadow:0 3px 0 rgba(241,197,43,.35);
}
.dynamic-balance::after{content:"円";font-size:.43em;margin-left:4px;letter-spacing:0}
.dynamic-checks{
 position:absolute;left:8.5%;right:8.5%;top:53.0%;height:7.2%;
 display:flex;justify-content:space-between;align-items:flex-start;padding:7px 18px 0;
 pointer-events:none;
}
.check-item{
 position:relative;z-index:1;width:18%;height:100%;display:flex;
 flex-direction:column;align-items:center;justify-content:flex-start;gap:0;
}
.check-box{
 width:min(52px,6.3vw);height:min(52px,6.3vw);flex:0 0 auto;border-radius:50%;
 border:2px solid #f23b80;background:#fff;
 box-shadow:0 1px 5px rgba(242,59,128,.12);
 display:flex;align-items:center;justify-content:center;
}
.check-box.done{background:linear-gradient(145deg,#f23b80,#ff72a5);border-color:#f23b80}
.check-box svg{width:43%;height:43%;opacity:0}.check-box.done svg{opacity:1}
.check-num{display:none !important;}
 .dynamic-use{
 position:absolute;left:13%;top:60.5%;width:74%;height:12%;
 margin:0;padding:0;border:0;border-radius:999px;background:transparent;
 color:transparent;font-size:0;line-height:0;text-indent:-9999px;overflow:hidden;
 appearance:none;-webkit-appearance:none;outline:none;cursor:pointer;box-shadow:none;
 z-index:20;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.dynamic-use::before,.dynamic-use::after{content:none !important;display:none !important}
.dynamic-use:active{background:rgba(255,255,255,.12)}
.dynamic-use:disabled{cursor:default}
.below{width:min(100vw,680px);padding:0 18px 28px;background:#fff}
.coupon-meta{display:flex;justify-content:space-between;padding:10px 4px;color:#a1a6b1;font-size:10px}
.history{margin-top:8px}
.history-title{font-size:12px;font-weight:900;color:#7b8190;margin-bottom:7px}
.history-list{background:#fafafd;border:1px solid #e7e8ee;border-radius:14px;overflow:hidden}
.history-row{display:flex;justify-content:space-between;padding:9px 11px;font-size:12px;border-bottom:1px solid #ececf1}
.history-row:last-child{border-bottom:0}
.history-empty{padding:13px;font-size:11px;color:#9298a4}
.staff-note{text-align:center;color:#9298a4;font-size:10px;line-height:1.5;margin-top:9px}
.overlay{position:fixed;inset:0;background:rgba(20,28,45,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.show{display:flex}
.sheet{width:min(100%,680px);background:#fff;border-radius:24px 24px 0 0;padding:24px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.15)}
.sheet h2{margin:0 0 8px;font-size:18px;color:#26344f}
.sheet p{margin:0 0 18px;font-size:12px;color:#7e8593;line-height:1.7}
.sheet-btns{display:flex;gap:10px}
.sheet-btns button{flex:1;border:0;border-radius:14px;padding:14px;font:900 14px "Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif}
.btn-cancel{background:#f0f1f4;color:#4d5360}.btn-confirm{background:#f23b80;color:#fff}
@media(min-width:681px){.dynamic-use{cursor:pointer}}

</style>
</head>

  document.getElementById("mascotImg").src = "data:image/png;base64," + MASCOT_B64;

  document.getElementById("shopName").textContent = CONFIG.storeName;
  document.getElementById("ribbonText").textContent = CONFIG.ribbonText;
  document.getElementById("taglineTop").textContent = CONFIG.taglineTop;
  document.getElementById("taglineBottom").textContent = CONFIG.taglineBottom;

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  var rulesListEl = document.getElementById("rulesList");
  CONFIG.rules.forEach(function (r) {
    var li = document.createElement("li");
    var safe = escapeHtml(r).replace(/([0-9,]+円)/g, "<b>$1</b>");
    li.innerHTML = safe;
    rulesListEl.appendChild(li);
  });

  var STORAGE_KEY = "coupon_state_v2";

  function makeId() {
    var chars = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
    var out = "";
    for (var i = 0; i < 8; i++) {
      out += chars[Math.floor(Math.random() * chars.length)];
      if (i === 3) out += "-";
    }
    return out;
  }

  function todayLabel() {
    var d = new Date();
    return d.getFullYear() + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0");
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (typeof parsed.balance === "number" && Array.isArray(parsed.history)) return parsed;
      }
    } catch (e) {
      console.error("coupon: read failed", e);
    }
    return {
      id: makeId(),
      issued: todayLabel(),
      balance: CONFIG.initialBalance,
      history: []
    };
  }

  function save(state) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error("coupon: save failed", e);
    }
  }

  var state = load();

  var balanceAmountEl = document.getElementById("balanceAmount");
  var balanceCaptionEl = document.getElementById("balanceCaption");
  var checkRowEl = document.getElementById("checkRow");
  var doneBadgeEl = document.getElementById("doneBadge");
  var useBtnEl = document.getElementById("useBtn");
  var historyListEl = document.getElementById("historyList");
  var couponIdEl = document.getElementById("couponId");
  var issuedLabelEl = document.getElementById("issuedLabel");
  var overlayEl = document.getElementById("overlay");
  var sheetDescEl = document.getElementById("sheetDesc");

  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12.5L9.5 18L20 6" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function totalUnits() {
    return Math.max(1, Math.round(CONFIG.initialBalance / CONFIG.unit));
  }

  function render() {
    balanceAmountEl.textContent = state.balance.toLocaleString("ja-JP");
    couponIdEl.textContent = "クーポンID " + state.id;
    issuedLabelEl.textContent = "発行日 " + state.issued;

    var usedCount = Math.round((CONFIG.initialBalance - state.balance) / CONFIG.unit);

    if (state.balance <= 0) {
      balanceCaptionEl.textContent = "ご利用ありがとうございました";
      doneBadgeEl.classList.add("show");
      useBtnEl.disabled = true;
      useBtnEl.textContent = "";
    } else {
      balanceCaptionEl.textContent = "ご利用可能な残高";
      doneBadgeEl.classList.remove("show");
      useBtnEl.disabled = false;
      useBtnEl.textContent = "";
    }

    checkRowEl.innerHTML = "";
    var n = totalUnits();
    for (var i = 0; i < n; i++) {
      var done = i < usedCount;
      var item = document.createElement("div");
      item.className = "check-item";
      var box = document.createElement("div");
      box.className = "check-box" + (done ? " done" : "");
      box.innerHTML = CHECK_SVG;
      var num = document.createElement("div");
      num.className = "check-num";
      num.textContent = (i + 1) + "回目";
      item.appendChild(box);
      item.appendChild(num);
      checkRowEl.appendChild(item);
    }

    if (state.history.length === 0) {
      historyListEl.innerHTML = '<div class="history-empty">まだ利用履歴はありません</div>';
    } else {
      historyListEl.innerHTML = "";
      var rows = state.history.slice().reverse();
      rows.forEach(function (h) {
        var row = document.createElement("div");
        row.className = "history-row";
        var left = document.createElement("span");
        left.textContent = h.label;
        var right = document.createElement("span");
        right.textContent = "-" + CONFIG.unit + "円";
        right.style.color = "#D81B60";
        right.style.fontWeight = "700";
        row.appendChild(left);
        row.appendChild(right);
        historyListEl.appendChild(row);
      });
    }
  }

  function openConfirm() {
    if (state.balance <= 0) return;
    sheetDescEl.textContent = "確定すると残高が" + CONFIG.unit + "円減り、残り" + (state.balance - CONFIG.unit).toLocaleString("ja-JP") + "円になります。";
    overlayEl.classList.add("show");
  }
  function closeConfirm() { overlayEl.classList.remove("show"); }

  function commitUse() {
    if (state.balance <= 0) { closeConfirm(); return; }
    state.balance = Math.max(0, state.balance - CONFIG.unit);
    var now = new Date();
    var label = now.getFullYear() + "/" + String(now.getMonth() + 1).padStart(2, "0") + "/" + String(now.getDate()).padStart(2, "0")
      + " " + String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    state.history.push({ label: label, amount: CONFIG.unit });
    save(state);
    render();
    closeConfirm();
  }

  useBtnEl.addEventListener("click", openConfirm);
  document.getElementById("cancelBtn").addEventListener("click", closeConfirm);
  document.getElementById("confirmBtn").addEventListener("click", commitUse);
  overlayEl.addEventListener("click", function (e) { if (e.target === overlayEl) closeConfirm(); });

  render();
})();
</script>
